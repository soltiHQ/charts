# The database mode with the chart's own Secret, from placeholder values, and
# each replica migrating at start, over TLS with a certificate of a public CA:
# no CA key, and the name it carries.
mode: database
secrets:
  jwtSecret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  enrollSecret: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
  bootstrapAdminPassword: ci-only-password
  databaseUrl: postgres://podium:ci-only-password@db-primary.example.com:5432/podium?sslmode=verify-full
  databaseReplicaUrl: postgres://podium:ci-only-password@db-replica.example.com:5432/podium?sslmode=verify-full
tls:
  server:
    secretName: podium-public-tls
    caKey: ""
  forwardServerName: podium.example.com
