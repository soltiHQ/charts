# The database mode, from an existing Secret that holds database-url and
# database-replica-url, with the migration Job, the drop of the schema on
# uninstall, the Deployment's own settings, and TLS between the replicas with
# the defaults of tls.server.caKey and tls.forwardServerName.
mode: database
replicas: 3
secrets:
  existingSecret: podium-secrets
migrate:
  mode: job
dropSchema:
  onUninstall: true
  wait: 90s
  activeDeadlineSeconds: 200
config:
  cluster:
    database:
      lease: 10s
      max_open_conns: 10
tls:
  server:
    secretName: podium-tls
    clientCA:
      secretName: agents-ca
extraEnvFrom:
  - secretRef:
      name: podium-extra-env
