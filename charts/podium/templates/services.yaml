apiVersion: v1
kind: Service
metadata:
  name: {{ include "podium.fullname" . }}
  labels:
    {{- include "podium.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "podium.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "podium.fullname" . }}-agents
  labels:
    {{- include "podium.labels" . | nindent 4 }}
  {{- with .Values.agents.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.agents.service.type }}
  {{- with .Values.agents.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector:
    {{- include "podium.selectorLabels" . | nindent 4 }}
  ports:
    - name: discovery
      port: {{ .Values.agents.service.discoveryPort }}
      targetPort: discovery
      protocol: TCP
      {{- with .Values.agents.service.discoveryNodePort }}
      nodePort: {{ . }}
      {{- end }}
    - name: grpc
      port: {{ .Values.agents.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      {{- with .Values.agents.service.grpcNodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- if .Values.ops.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "podium.fullname" . }}-ops
  labels:
    {{- include "podium.labels" . | nindent 4 }}
    app.kubernetes.io/component: ops
  {{- with .Values.ops.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "podium.selectorLabels" . | nindent 4 }}
  ports:
    - name: ops
      port: {{ .Values.ops.service.port }}
      targetPort: ops
      protocol: TCP
{{- end }}
---
# The StatefulSet's governing Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "podium.fullname" . }}-headless
  labels:
    {{- include "podium.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "podium.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
