{{- if not .Values.secrets.existingSecret }}
{{- $jwt := required "secrets.jwtSecret is required, or name an existing Secret in secrets.existingSecret: generate it with openssl rand -hex 32" .Values.secrets.jwtSecret }}
{{- if lt (len $jwt) 32 }}
{{- fail "secrets.jwtSecret must be 32 bytes or more: podium refuses a shorter one" }}
{{- end }}
{{- $enroll := .Values.secrets.enrollSecret }}
{{- if and (not $enroll) (not .Values.secrets.allowOpenEnrollment) }}
{{- fail "secrets.enrollSecret is required to close agent enrollment (openssl rand -hex 32); set secrets.allowOpenEnrollment=true to run without one" }}
{{- end }}
{{- if and $enroll (lt (len $enroll) 32) }}
{{- fail "secrets.enrollSecret must be 32 bytes or more: podium refuses a shorter one" }}
{{- end }}
{{- $admin := .Values.secrets.bootstrapAdminPassword }}
{{- if and $admin (or (lt (len $admin) 12) (gt (len $admin) 72)) }}
{{- fail "secrets.bootstrapAdminPassword must be 12 characters to 72 bytes" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "podium.fullname" . }}
  labels:
    {{- include "podium.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.jwtSecret }}: {{ $jwt | quote }}
  {{- with $enroll }}
  {{ $.Values.secrets.keys.enrollSecret }}: {{ . | quote }}
  {{- end }}
  {{- with $admin }}
  {{ $.Values.secrets.keys.bootstrapAdminPassword }}: {{ . | quote }}
  {{- end }}
{{- end }}
