# The chart runs podium in one of two modes.
#
# memory:   one node whose state lives in the pod's memory and is lost with the
#           pod. One replica, a Deployment that stops the old pod before it
#           starts the new one, and no volume. For trying podium out.
# database: replicas of podium that share a Postgres database you provide. The
#           replicas hold no state: one of them leads, through a lease row, and
#           runs the leader-only work, and the others forward their writes to it.
#
# Both modes need an image newer than the chart's appVersion, which predates
# them: the memory mode one built with Part A of podium's storage modes (the
# `memory` backend), the database mode one built with Part B (the `database`
# backend). Set image.tag or image.digest; the release that publishes the chart
# sets appVersion.
#
# raft is not covered by this chart. Changing the mode of a release changes where
# the state lives: nothing moves from one to the other.
mode: memory

# The replicas of the database mode, 2 or more for availability. The memory mode
# always runs one.
replicas: 2

image:
  repository: ghcr.io/soltihq/podium
  # Defaults to the chart's appVersion.
  tag: ""
  # Pins the image by digest; it wins over the tag when set.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# The secrets podium reads from its environment. Keep their values: a changed
# enrollment secret locks out every agent enrolled under the old one, and a
# changed JWT secret ends every session.
secrets:
  # An existing Secret that holds the keys below. When empty, the chart makes a
  # Secret from jwtSecret, enrollSecret and bootstrapAdminPassword.
  existingSecret: ""
  keys:
    jwtSecret: jwt-secret
    enrollSecret: enroll-secret
    bootstrapAdminPassword: bootstrap-admin-password
    # Database mode: the primary, and the optional read endpoint.
    databaseUrl: database-url
    databaseReplicaUrl: database-replica-url
  # SOLTI_AUTH_JWT_SECRET: 32 bytes or more (openssl rand -hex 32).
  jwtSecret: ""
  # SOLTI_AGENT_AUTH_ENROLL_SECRET: 32 bytes or more (openssl rand -hex 32).
  enrollSecret: ""
  # SOLTI_BOOTSTRAP_ADMIN_PASSWORD: the first administrator's password, 12
  # characters to 72 bytes. Memory mode: each start seeds the administrator
  # again, from this password when set, else from a random one that podium logs
  # once at WARN (kubectl logs); keep the key to get one password across
  # restarts, as the state, a changed password included, is lost with the pod.
  # Database mode: an empty database needs it, and podium refuses to start
  # without it. It is used on the first start only: once users exist podium
  # ignores it and the leader warns about it at the start of each of its terms,
  # so remove the key after you changed the password, and restart.
  bootstrapAdminPassword: ""
  # Database mode: SOLTI_CLUSTER_DATABASE_URL, the primary, for example
  # postgres://podium:<password>@db.example.com:5432/podium?sslmode=verify-full.
  # The URL carries the password: prefer an existing Secret with the key
  # database-url, so that it stays out of your Helm values and release history.
  # The chart never generates it.
  databaseUrl: ""
  # SOLTI_CLUSTER_DATABASE_REPLICA_URL, optional: a read endpoint that serves the
  # lists of the UI and the API, which can lag the primary.
  databaseReplicaUrl: ""
  # Without an enrollment secret, any host that reaches the agents' listeners
  # can enroll a new agent ID (trust on first use). The chart refuses to render
  # without one unless this is true.
  allowOpenEnrollment: false

# podium.yaml, mounted at /etc/podium/podium.yaml and passed with --config.
# Loading is strict: a key that is not a setting, or a key without a value,
# stops podium at start. The environment wins over this file; the chart sets
# SOLTI_CLUSTER_BACKEND (and, in the database mode, the database URLs and the
# advertise address), and the image sets SOLTI_OPS_ADDR=:8081. Database settings
# the chart does not set go here, under cluster.database: lease, max_open_conns.
# Every setting: https://github.com/soltiHQ/podium/blob/main/internal/config/README.md#every-setting
config:
  log:
    level: info
    format: json
  server:
    # The time Kubernetes needs to take the pod out of its Services after
    # /readyz turns to 503 at SIGTERM.
    shutdown_delay: 5s
    shutdown_timeout: 15s
  # Behind an ingress that terminates TLS, list its pods' CIDR so podium sees
  # the client's IP and that it used HTTPS, for example:
  # trusted_proxies:
  #   - 10.42.0.0/16
  # or, if the ingress cannot be listed, keep the cookies Secure regardless:
  # auth:
  #   cookie_secure: always

# TLS on podium's own listeners, tls.server: 8080, 8082 and 50051 (the ops
# listener stays plain HTTP). The SDK sends an agent's token only over TLS,
# unless the agent allows otherwise. podium reads the files at start only: a
# renewed certificate takes effect when the pod restarts. With TLS on 8080, an
# ingress must speak HTTPS to the UI Service (its backend-protocol setting).
tls:
  server:
    # A kubernetes.io/tls Secret (tls.crt, tls.key), cert-manager's for example.
    secretName: ""
    # Database mode: the key of that Secret that holds the CA of its
    # certificate, against which a follower checks the leader's certificate
    # when it forwards a write. cert-manager writes ca.crt for a CA or a
    # self-signed issuer. Set "" for a certificate of a public CA: a follower
    # then checks the leader against the system roots, or against
    # SOLTI_TLS_CLIENT_CA_FILE when extraEnv sets it (see the README,
    # "Replicas over TLS"). The Secret must hold the key named here, or no pod
    # starts.
    caKey: ca.crt
    # The agents' CA: with it, the agents' listeners (8082, 50051) require a
    # client certificate of that CA. The UI never asks for one.
    clientCA:
      secretName: ""
      key: ca.crt
  # Database mode: the name a follower checks the leader's certificate for when
  # it forwards a write, so that the certificate of tls.server must carry it as
  # a DNS name. The replicas share that one certificate, whatever their pod
  # IPs. Empty: the UI Service's name, <fullname>.<namespace>.svc.
  forwardServerName: ""

# Database mode: who migrates the schema, mode:
#   start     each replica at start, under a database lock, so replicas that
#             start together migrate once.
#   job       podium migrate as a Helm hook, before the install and before each
#             upgrade. The Job brings its own copies of the ConfigMap and the
#             Secret, hooks too, from these values. helm install --no-hooks and
#             helm upgrade --no-hooks skip it, and the replicas then refuse the
#             old schema.
#   external  a tool of your own, as Bytebase, before the install and before
#             each upgrade, from podium's migrations (podium schema export
#             writes them out); the chart runs no Job. The database URL may
#             then be a role that only reads and writes rows. dropSchema.
#             onUninstall must stay false: the schema is that tool's to drop.
# With job and external the replicas get SOLTI_CLUSTER_DATABASE_MIGRATE=false
# and do not migrate: one whose schema is older than its own refuses to start.
# Anything else stops the render.
migrate:
  mode: start
  job:
    # The Job's limit, with mode job, including the 30 seconds podium waits for
    # an unreachable database before it fails.
    activeDeadlineSeconds: 600

# Database mode: podium drop-schema as a Helm hook after helm uninstall. When
# on, the uninstall drops every table of podium's from the database, and all of
# its data with them: users, agents, specs, rollouts, run history. Nothing
# brings them back but a backup. Off, the uninstall leaves the database as it
# is, and a later install on it finds the state again. podium drops its own
# tables only: no other table, no schema of the database's, not the database.
#
# onUninstall must be true or false, unquoted: anything else stops the render,
# as a string "false" would count as true. The hook is stored with the release:
# set this with helm install or helm upgrade before you uninstall, for example
#   helm upgrade <release> <chart> --reset-then-reuse-values \
#     --set dropSchema.onUninstall=true
# It runs once Helm deleted the release's objects, while their pods may still
# stop: podium drop-schema waits until no replica runs on the database, then
# drops the tables in one transaction. Only replicas that run protect the
# database: one still running once wait is over, of another release on the same
# database say, fails the Job, and nothing is dropped; a deployment that runs no
# replica at that moment is not seen. The Job makes one attempt (backoffLimit
# 0). It brings its own copies of the ConfigMap and the Secret, as the release's
# are gone; everything else the pod refers to must still exist at the
# uninstall: the Secret of secrets.existingSecret, the TLS Secrets, the objects
# of extraVolumes and extraEnvFrom, the imagePullSecrets. helm uninstall
# --no-hooks skips it. It needs an image with podium drop-schema. See the
# README, "Uninstall".
dropSchema:
  onUninstall: false
  # How long podium drop-schema waits for the replicas to stop, and for a lock
  # another session holds on a table, a duration of 16 characters at most: more
  # than terminationGracePeriodSeconds, and the lease on top for a leader that
  # is killed, whose lease expires rather than being released.
  wait: 2m
  # The Job's limit, a whole number of seconds: the wait, the 30 seconds podium
  # waits for an unreachable database, and the drop. helm uninstall waits for
  # the hook up to its --timeout, 5 minutes by default: keep that above this
  # limit, plus the time to schedule the pod and pull the image.
  activeDeadlineSeconds: 240

# Extra environment variables, volumes and mounts for the podium container,
# for tls.client (podium as a client of the agents) for instance.
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

# The web UI and the REST API (8080).
service:
  type: ClusterIP
  port: 8080
  annotations: {}

# The agents' listeners: HTTP discovery (8082) and gRPC (50051). Agents outside
# the cluster need a LoadBalancer or a NodePort here.
agents:
  service:
    type: ClusterIP
    annotations: {}
    discoveryPort: 8082
    grpcPort: 50051
    # For type NodePort or LoadBalancer; empty lets Kubernetes choose.
    discoveryNodePort: ""
    grpcNodePort: ""
    # Local keeps the agents' source IPs visible to podium.
    externalTrafficPolicy: ""

# The ops listener (8081): /livez, /readyz, /leaderz, /version and /metrics,
# plain HTTP without authentication. The probes use it on the pod; this Service
# is for scraping, and must stay internal.
ops:
  service:
    enabled: true
    port: 8081
    annotations: {}

ingress:
  enabled: false
  className: ""
  # A proxy in front of the UI keeps its read timeout above 15 seconds: a quiet
  # event or log stream sends a keepalive only every 15 seconds.
  annotations: {}
  hosts:
    - host: podium.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: podium-tls
  #    hosts:
  #      - podium.example.com

metrics:
  serviceMonitor:
    # Needs the Prometheus operator's ServiceMonitor CRD, and ops.service.enabled.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # podium does not call the Kubernetes API.
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # fsGroup applies to the volumes the chart mounts, the config and the TLS
  # Secrets, whose files it makes group 65532, and to a volume that extraVolumes
  # adds when its type supports it. fsGroupChangePolicy matters only for such an
  # added volume, a PersistentVolumeClaim for one: Kubernetes ignores it for
  # ConfigMap and Secret volumes.
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# A graceful stop takes up to server.shutdown_delay, plus
# server.shutdown_timeout, plus 30 seconds to close the hubs and connections: 50 seconds with
# the defaults above. Raise this with them.
terminationGracePeriodSeconds: 60

probes:
  startup:
    periodSeconds: 2
    failureThreshold: 60
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 6

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

# helm test: checks /readyz on the ops Service.
tests:
  # busybox:1.37
  image: busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
